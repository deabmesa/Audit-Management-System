version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: audit-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_main
      POSTGRES_USER: audit_app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_app -d audit_main"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
