name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: audit_main
          POSTGRES_USER: audit_app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_app -d audit_main"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, pdo_pgsql
          tools: composer

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify PostgreSQL service
        env:
          PGPASSWORD: secret
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U audit_app -d audit_main -c "select version();"

      - name: PHP syntax lint
        run: find app config database routes -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Shell script lint
        run: bash -n scripts/rhel8/*.sh scripts/codespaces/*.sh
