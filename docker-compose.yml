version: '3.9'

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: audit-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: audit_app
      APP_USER_PASSWORD: audit_app
    ports:
      - "1521:1521"
    volumes:
      - ./docker/oracle-init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16
    container_name: audit-postgres
    environment:
      POSTGRES_DB: audit_reporting
      POSTGRES_USER: audit_reporting
      POSTGRES_PASSWORD: audit_reporting
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_reporting -d audit_reporting"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit-app
    depends_on:
      oracle:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
