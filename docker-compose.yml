version: '3.8'
services:
  app:
    build: .
    container_name: audit_app
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/var/www/html
  postgres:
    image: postgres:16
    container_name: audit_postgres
    environment:
      POSTGRES_DB: audit_management
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: audit_redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
