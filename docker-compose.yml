version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: audit_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: sh -c "php artisan migrate --seed && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:15
    container_name: audit_db
    environment:
      POSTGRES_DB: audit_management
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
